<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2a3f34" />
  <title>Calm Canine | Admin Login</title>
  <link rel="icon" href="../../assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body class="commerce-page admin-page admin-login-page">
  <header class="site-header">
    <a class="brand" href="../../"><span class="brand-mark">🐾</span><span>CALM CANINE</span></a>
    <nav class="site-nav" aria-label="Admin">
      <span class="admin-nav-label">Admin</span>
    </nav>
  </header>

  <main class="commerce-main admin-main">
    <div class="commerce-head">
      <p class="eyebrow">ADMIN</p>
      <h1>Sign in</h1>
      <p class="commerce-lead">Enter the admin password to manage orders and purchases.</p>
    </div>

    <form class="commerce-panel admin-login-panel" data-admin-login novalidate>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="field-error" data-login-error hidden></p>
      <button type="submit" class="btn btn-primary btn-block" data-login-submit>Sign in</button>
    </form>
  </main>
  <script src="../../admin-api.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
