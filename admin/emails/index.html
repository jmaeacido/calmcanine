<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2a3f34" />
  <title>Calm Canine | Admin Emails</title>
  <link rel="icon" href="../../assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css" />
</head>
<body class="commerce-page admin-page">
  <header class="site-header">
    <a class="brand" href="../../"><span class="brand-mark">🐾</span><span>CALM CANINE</span></a>
    <nav class="site-nav" aria-label="Admin">
      <a href="../">Orders</a>
      <a href="./" aria-current="page">Emails</a>
      <button type="button" class="admin-logout" data-admin-logout>Log out</button>
    </nav>
  </header>

  <main class="commerce-main admin-main">
    <div class="commerce-head">
      <p class="eyebrow">ADMIN</p>
      <h1>Inbound &amp; outbound emails</h1>
      <p class="commerce-lead">Contact submissions and Google Workspace mail, plus every transactional email sent through Brevo.</p>
    </div>

    <div class="commerce-panel admin-toolbar">
      <label class="field admin-search-field">
        <span>Search</span>
        <input type="search" placeholder="Sender, recipient, or subject" data-email-search />
      </label>
      <label class="field admin-direction-field">
        <span>Direction</span>
        <select data-email-direction>
          <option value="">All email</option>
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
        </select>
      </label>
      <button class="btn btn-secondary admin-refresh-button" type="button" data-email-refresh>Refresh inbox</button>
      <p class="admin-count" data-email-count></p>
    </div>

    <p class="admin-action-ok admin-email-sync" data-email-sync hidden></p>
    <div class="commerce-panel admin-table-wrap" data-email-loading><p class="commerce-lead">Synchronizing email…</p></div>
    <div class="commerce-panel admin-table-wrap" data-email-empty hidden><p class="commerce-lead">No emails match this view.</p></div>
    <div class="commerce-panel admin-table-wrap" data-email-table hidden>
      <table class="admin-table admin-email-table">
        <thead><tr><th>Direction</th><th>Date</th><th>From / To</th><th>Subject &amp; preview</th><th>Status</th></tr></thead>
        <tbody data-email-rows></tbody>
      </table>
    </div>
  </main>

  <script src="../../admin-api.js"></script>
  <script src="emails.js"></script>
</body>
</html>
